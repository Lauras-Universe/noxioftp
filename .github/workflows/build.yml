name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # main.go embeds frontend/dist, which is only built in the build jobs
      - name: Placeholder for embedded frontend
        run: mkdir -p frontend/dist && touch frontend/dist/.keep
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: noxioftp-macos
          - os: windows-latest
            platform: windows/amd64
            artifact: noxioftp-windows
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: noxioftp-linux
    runs-on: ${{ matrix.os }}
    env:
      # safety margin for the Monaco bundle; it builds in ~1.6 GB since it is imported selectively
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Version
        id: ver
        shell: bash
        run: |
          # release builds (tag v1.2.3) know their version and check for updates; other builds are "dev"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "value=dev" >> "$GITHUB_OUTPUT"; fi
      - name: Build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: wails build -platform ${{ matrix.platform }} -tags webkit2_41 -ldflags "-X main.version=${{ steps.ver.outputs.value }}"
      - name: Build (macOS, Windows)
        if: runner.os != 'Linux'
        shell: bash
        run: wails build -platform ${{ matrix.platform }} -ldflags "-X main.version=${{ steps.ver.outputs.value }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent build/bin/NoxioFTP.app ${{ matrix.artifact }}.zip
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/NoxioFTP.exe -DestinationPath ${{ matrix.artifact }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cp build/appicon.png build/bin/noxioftp.png   # for the launcher entry the install script creates
          tar -czf ${{ matrix.artifact }}.tar.gz -C build/bin NoxioFTP noxioftp.png

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 1
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        # the program verifies downloads for self-updates against this file
        run: cd dist && sha256sum noxioftp-* > sha256sums.txt && cat sha256sums.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
